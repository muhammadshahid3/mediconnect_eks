version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: mediconnect-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - mediconnect-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mediconnect-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/mediconnect
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongo
    networks:
      - mediconnect-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: mediconnect-client
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - server
    networks:
      - mediconnect-network

networks:
  mediconnect-network:
    driver: bridge

volumes:
  mongo_data:
  uploads_data:
