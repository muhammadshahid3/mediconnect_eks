name: Docker Hub Push

on:
  push:
    branches: [ "main" ] # Jab main branch par push ho

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    
    # 1. Code download karna
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Docker Hub Login
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. Client Image Build aur Push
    - name: Build & Push Client
      uses: docker/build-push-action@v5
      with:
        context: ./client # Client folder ka path
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/mediconnect-client:latest

    # 4. Server Image Build aur Push
    - name: Build & Push Server
      uses: docker/build-push-action@v5
      with:
        context: ./server # Server folder ka path
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/mediconnect-server:latest
